kind = "web"
previewPath = "/"
title = "CrossCures — AI Health Companion"
version = "1.0.0"
id = "artifacts/crosscures"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23043

[services.development]
run = "pnpm --filter @workspace/crosscures run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/crosscures", "run", "build" ]
publicDir = "artifacts/crosscures/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23043"
BASE_PATH = "/"
